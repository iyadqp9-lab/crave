name: Validate Crave build setup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/selfhosted.yml"
      - ".github/scripts/crave-remote-build.sh"
      - ".github/workflows/validate-crave-setup.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate remote build script syntax
        run: bash -n .github/scripts/crave-remote-build.sh

      - name: Validate workflow YAML and runner shell syntax
        run: |
          ruby <<'RUBY'
          require "yaml"
          YAML.parse_file(".github/workflows/selfhosted.yml")
          YAML.parse_file(".github/workflows/validate-crave-setup.yml")
          workflow = YAML.load_file(".github/workflows/selfhosted.yml")
          step = workflow.fetch("jobs").fetch("build").fetch("steps").find do |item|
            item["name"] == "Start compilation through 'crave'"
          end
          abort "Could not find the Crave compile step." unless step && step["run"]
          File.write(File.join(ENV.fetch("RUNNER_TEMP"), "crave-compile-step.sh"), step.fetch("run"))
          puts "Workflow YAML parses and the build step was extracted."
          RUBY
          bash -n "$RUNNER_TEMP/crave-compile-step.sh"

      - name: Check Crave build inputs and compatibility libraries
        run: |
          grep -q 'INPUT_PRODUCT_NAME:' .github/workflows/selfhosted.yml
          grep -q 'PRODUCT_NAME="$(decode_b64' .github/scripts/crave-remote-build.sh
          grep -q 'libncurses5_6.2-0ubuntu2.1_amd64.deb' .github/scripts/crave-remote-build.sh
          grep -q 'REMOTE_SCRIPT_B64' .github/workflows/selfhosted.yml
